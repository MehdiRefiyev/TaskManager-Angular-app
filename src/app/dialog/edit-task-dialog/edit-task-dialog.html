<h2 mat-dialog-title class="dialog-title">{{ title }}</h2>
<mat-dialog-content class="p-0 w-100">
  <mat-form-field class="w-100">
    <mat-label>Task Title</mat-label>
    <input matInput [(ngModel)]="task.title" ng-model="someTextField" />
    <button 
      matSuffix 
      mat-icon-button 
      type="button"
      aria-label="Clear" 
      (click)="task.title = ''">
      <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="24" height="24" viewBox="0 0 24 24">
        <path d="M 4.7070312 3.2929688 L 3.2929688 4.7070312 L 10.585938 12 L 3.2929688 19.292969 L 4.7070312 20.707031 L 12 13.414062 L 19.292969 20.707031 L 20.707031 19.292969 L 13.414062 12 L 20.707031 4.7070312 L 19.292969 3.2929688 L 12 10.585938 L 4.7070312 3.2929688 z"></path>
      </svg>
    </button>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions class="p-0">
  <button mat-button (click)="cancel()">Cancel</button>
  @if(task.title.trim() === '') {
    <button mat-raised-button color="primary" (click)="save()" disabled="true">Save</button>
  }
  @else {
    <button mat-raised-button color="primary" (click)="save()">Save</button>
  }
</mat-dialog-actions>
