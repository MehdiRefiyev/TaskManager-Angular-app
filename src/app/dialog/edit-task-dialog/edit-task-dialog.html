<h2 mat-dialog-title class="dialog-title">{{ title }}</h2>

<mat-dialog-content class="p-0 w-100">
  <mat-form-field class="w-100">
    <mat-label>Task Title</mat-label>
    <input matInput [(ngModel)]="task.title" ng-model="someTextField" />
    <button 
      matSuffix 
      mat-icon-button 
      type="button"
      aria-label="Clear" 
      (click)="task.title = ''">
      <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="24" height="24" viewBox="0 0 24 24">
        <path d="M 4.7070312 3.2929688 L 3.2929688 4.7070312 L 10.585938 12 L 3.2929688 19.292969 L 4.7070312 20.707031 L 12 13.414062 L 19.292969 20.707031 L 20.707031 19.292969 L 13.414062 12 L 20.707031 4.7070312 L 19.292969 3.2929688 L 12 10.585938 L 4.7070312 3.2929688 z"></path>
      </svg>
    </button>
  </mat-form-field>

  <mat-form-field class="w-100">
    <mat-label>Category</mat-label>
    <mat-select [formControl]="category" disableRipple>
      @for (category of categoryList; track category) {
        <mat-option [value]="{id: category.id, title: category.title}">{{category.title}}</mat-option>
      }
      <mat-option [value]="{id: null, title: null}">Without category</mat-option>
    </mat-select>
  </mat-form-field>

    <mat-form-field class="w-100">
      <mat-label>Priority</mat-label>
      <mat-select [formControl]="priority" disableRipple>
        @for (priority of priorityList; track priority) {
          <mat-option [value]="{id: priority.id, title: priority.title}">{{priority.title}}</mat-option>
        }
        <mat-option [value]="{id: 4, title: 'Without priority', color: 'red'}">Without priority</mat-option>
      </mat-select>
    </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions class="p-0">
  <button mat-button (click)="cancel()">Cancel</button>
  @if(task.title.trim() === '') {
    <button mat-raised-button color="primary" (click)="save()" disabled="true">Save</button>
  }
  @else {
    <button mat-raised-button color="primary" (click)="save()">Save</button>
  }

  <button mat-button (click)="deleteTask()">Delete</button>
</mat-dialog-actions>
